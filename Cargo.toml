[package]
name = "rage-render"
version = "0.5.0"
edition = "2021"
description = "Software renderer, contact sheets and glTF export for RAGE drawables parsed by rage-formats"
license = "Unlicense"
repository = "https://github.com/VIRUXE/rage-render"
keywords = ["gta", "rage", "render", "gltf", "ydr"]
categories = ["rendering", "game-development"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rage-formats = { version = "0.5", git = "https://github.com/Mesrine67/rage-formats", rev = "99dc484f96a66e2f1897885b68f9d7b34437aa3c" }
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
json = "0.12"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
flate2 = "1.0"
rage-formats = { version = "0.5", git = "https://github.com/Mesrine67/rage-formats", rev = "99dc484f96a66e2f1897885b68f9d7b34437aa3c", features = ["test-support"] }
